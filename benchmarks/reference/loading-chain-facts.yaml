- id: NSA-DS-LC-026
  pattern_type: driver-release-and-service-registration
  source:
    sample_md5: 4ebc080ab79470e3c2d59acd594aa1d3
    tool_name: DanderSpiritz
    platform_name: DeMi (DecibalMinute)
    component: DiBa bootkit 持久化
    file: DiBa_Target_BH_2000.dll
    function_offset: sub_10013540 (资源查找) @ 0x10013540
    description: 'DiBa bootkit 持久化流程。资源查找函数 sub_10013540 内 7 个 CR-007 宽密文解密: "%csystemroot%c\system32\drivers\%s"(驱动释放路径模板), "\registry\machine\system\CurrentControlSet\Services"(服务注册路径), "Type"/"Start"/"ImagePath"(服务值名), ".sys"(扩展名), ".rsrc"(资源节)。流程: FindResource(.rsrc,id) → LCG+zlib解密 → 写 %systemroot%\system32\drivers\<名>.sys → 注册服务(Type/Start/ImagePath) → 服务加载驱动。'
    pe_timestamp: '2013-10-01'
  indicators:
  - type: string
    value: '%systemroot%\system32\drivers\%s'
    context: 驱动释放路径模板(CR-007加密)
  - type: string
    value: '\registry\machine\system\CurrentControlSet\Services'
    context: 服务注册路径(CR-007加密)
  - type: api
    value: FindResourceA + LoadResource + LockResource + CreateFileA + WriteFile + OpenSCManagerA + OpenServiceW
    context: 资源加载+写文件+服务管理
  references:
  - IDA 直接分析: DiBa_Target_BH_2000.dll i386 — 2026-08-23
  status: confirmed
  confidence: extreme
  uniqueness_note: 驱动释放路径 %systemroot%\system32\drivers\%s + 服务注册 CurrentControlSet\Services 是bootkit标准持久化。Check Point 2021 已记录 fvexpy.sys(拼写少p,MD5 F7F382A0C610177431B27B93C4C87AC1,DoubleFeature框架),本文本实测 fvepxy.pdb(拼写含p,MD5 a895647e6f0c93af8d4081ede96bde33,DiBa框架)——同驱动源码跨框架复用(DiBa+DoubleFeature),不同编译版本MD5不同。\system32\drivers\fvepxy.sys + 服务名 = DiBa bootkit直接指纹。
  detection_domains:
  - '终端: 检测 system32\drivers\fvepxy.sys 文件 + 对应服务(ImagePath指向该驱动)'
  - '终端: 搜索CR-007密文对应的释放路径模板'
  source_type: IDA静态分析发现
  purpose: DiBa bootkit 持久化——释放内嵌驱动到system32\drivers\并注册服务，实现引导级持久化。
