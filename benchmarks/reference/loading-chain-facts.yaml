  - '终端: DiBa_Target.dll检测'
  source_type: 跨样本对比发现
  purpose: DiBa_Target.dll实现注册表VFS，完全使用Win32 Registry API而非NT syscall，通过IOCTL与内核通信。用户态VFS实现罕见，是强检测信号。
  discovery_date: '2013-08-08'
