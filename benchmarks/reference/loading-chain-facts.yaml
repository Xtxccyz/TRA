- id: NSA-DS-LC-001
  pattern_type: smb-kernel-backdoor-bootstrap
  source:
    sample_md5: 4f27cd3907d19961c0b724bc2ca25323
    tool_name: DanderSpiritz
    component: DoublePulsar → PeddleCheap
    file: PeddleCheap implant (PC_Level3_exe)
    function_offset: N/A
    note: '2026-08-13 网络签名落地: SMB Trans2 SESSION_SETUP (subcommand 0x0E) ping，响应 Multiplex ID 0x51(x86)/0x52(x64)=已感染，0x41=未感染。检测规则 rules/doublepulsar_suricata.rules + 文档 rules/doublepulsar-network-signature.md。first-party Doublepulsar-1.3.1.0.xml 确认 RunDLL 默认注入 lsass.exe。'
    description: DoublePulsar 内核 SMB 后门将 PeddleCheap 注入 lsass.exe。PeddleCheap 随后启动完整 DanderSpiritz 框架。
    pe_timestamp: '2013-07-17T14:11:10'
  mechanism:
    entry_point: SMB TRANS2 SESSION_SETUP 隐写传输
    injection_target: lsass.exe
    architecture: ring-0 内核后门 → ring-3 用户态植入物
  indicators:
  - type: protocol
    value: SMB TRANS2 SESSION_SETUP on port 445/139
  - type: injection_target
    value: lsass.exe
  - type: network_signature
    value: SMB Trans2 Session Setup subcommand 0x0E; response Multiplex ID 0x51(x86)/0x52(x64)=infected, 0x41=uninfected
  - type: clsid
    value: '{A682FEC0-333F-B16A-4EE6-24CC2BAF1185}'
  references:
  - '[引用待补全：需定位原文] Check Point Research, 2021年12月'
