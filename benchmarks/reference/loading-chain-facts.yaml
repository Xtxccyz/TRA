  - '网络侧: SMB TRANS2 SESSION_SETUP端口445/139隐写传输'
  - '终端: lsass.exe中注入的PeddleCheap检测CLSID {A682FEC0-333F-B16A-4EE6-24CC2BAF1185}'
  source_type: 文档情报交叉验证
  purpose: DoublePulsar内核SMB后门→ring-0注入lsass.exe→启动PeddleCheap用户态植入物→完整DanderSpritz框架。SMB TRANS2 SESSION_SETUP隐写传输。[Check Point 2021]+[Forcepoint]验证。
