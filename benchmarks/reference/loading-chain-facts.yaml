- id: NSA-DS-LC-008
  pattern_type: ordinal1-vtable-plugin-loader
  source:
    sample_md5: eb73817bda68e6e13dcfd6cd567b4e57
    tool_name: DanderSpiritz
    component: DszLpCore.exe (框架核心)
    file: DszLpCore.exe
    function_offset: sub_466153 @ 0x466153 (插件加载器), sub_454EDE @ 0x454EDE (插件调度)
    description: 'DszLpCore.exe 通过 LoadLibraryW + GetProcAddress(ordinal=1) 加载插件 DLL。sub_466153: LoadLibraryW(dll) → GetProcAddress(hmod, 1) → 保存 vtable 到 a1+24。sub_454EDE: 三模式调度(type=1加载/2卸载/3获取), 错误码25007。与 DiBa_Target.dll 的 i_1 导出(返回全局数据指针)匹配 — 所有 DanderSpiritz 插件 DLL 实现此约定。'
    pe_timestamp: '2013-02-01T20:17:50'
  mechanism:
    loader: sub_466153
    dispatcher: sub_454EDE
    convention: GetProcAddress(dll_handle, ordinal=1) → vtable/config pointer
    modes: 1=LoadLibraryW加载, 2=FreeLibrary卸载, 3=GetModuleHandleW获取
  indicators:
  - type: plugin_convention
    value: GetProcAddress_ordinal_1_returns_vtable
  - type: function_name
    value: sub_466153
    context: plugin_loader
  references:
  - 'IDA 直接分析: DszLpCore.exe x86 — 2026-08-05'
  status: confirmed
  confidence: extreme
  uniqueness_note: GetProcAddress(ordinal=1)+三模式调度是 NSA 插件系统独特架构。多数恶意软件使用命名导出。
  detection_domains:
  - '终端: LoadLibraryW+GetProcAddress(ordinal=1)非标准DLL加载模式'
  source_type: 跨样本对比发现
  purpose: DszLpCore.exe通过LoadLibraryW+GetProcAddress(ordinal=1)加载DLL，非标准DLL加载方式，绕过LoadLibrary的模块列表注册。
  discovery_date: '2013-02-01'
  compared_samples:
  - file: DiBa_Target.dll
    sample_md5: c25dd2a4620a42fd
    note: 对比DiBa ordinal=1加载模式
  - file: Hide_Target.dll
    sample_md5: 待查
    note: 对比Hide ordinal=1加载模式
  finding_tags:
  - NSA共性
- id: NSA-DS-LC-009
  pattern_type: registry-vfs-no-win32-api
  source:
    sample_md5: 7b631b6dab156a47f085f4abe4b2acfe
    tool_name: DanderSpiritz
    component: DiBa (DiveBar)
    file: DiBa_Target.dll
    function_offset: sub_18001A3EC @ 0x18001A3EC (VFS主调度器, 129BB), sub_18001A0F4 @ 0x18001A0F4 (SCM服务检查)
    description: DiBa_Target.dll 实现注册表VFS但完全不导入Win32 Registry API。VFS通过NT syscall或驱动IOCTL实现绕过用户态hook。SCM操作使用标准API(OpenSCManagerA+OpenServiceW+QueryServiceStatus)。所有字符串(ElbyCDIO.sys, LSAExtensionConfig, 注册表键名)通过95字节替换表加密存储,函数级解密/重加密。单导出i_1返回全局数据指针(符合DszLpCore插件约定)。
    pe_timestamp: '2013-08-08T13:33:49'
  mechanism:
    vfs: NT syscall 或驱动 IOCTL (非 Win32 API)
    scm: 标准 Win32 SCM API
    persistence:
    - KSLA(未签名驱动)
    - JustVisiting(ElbyCDIO.sys CVE)
    - SolarTime(VBR bootkit)
    - Default(标准驱动)
  indicators:
  - type: technique
    value: registry_vfs_no_win32_registry_api
