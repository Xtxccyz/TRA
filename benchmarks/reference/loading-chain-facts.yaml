- id: NSA-DS-LC-010
  pattern_type: nsa-credential-theft-vs-public-mimikatz
  source:
    sample_md5: 8d7364e9 (DuplicateToken)
    tool_name: DanderSpiritz
    component: ZBng 凭证窃取模块组
    file: DuplicateToken_Target.dll, LogonAsUser_Target.dll, RemoteExecute_Target.dll, Shares_Target.dll
    function_offset: 各模块 ordinal=1 导出
    description: 'NSA ZBng 4模块实现类似 Mimikatz 凭证操作但架构不同。DuplicateToken(57KB): OpenProcessToken+DuplicateTokenEx+AdjustTokenPrivileges+ImpersonateLoggedOnUser, 依赖Mcl_NtElevation内核提权(非token::elevate用户态)。LogonAsUser(37KB): LogonUserW。Shares(77KB): NetUseEnum+WNetEnumResource+CoSetProxyBlanket, COM认证操纵非LSASS读取。RemoteExecute(50KB): 远程执行。所有模块LP=Yes, DszLpCore插件架构。'
    pe_timestamp: ERROR:MD5 not in _md5_index.json
  mechanism:
    api_overlap:
    - OpenProcessToken
    - DuplicateTokenEx
    - AdjustTokenPrivileges
    - ImpersonateLoggedOnUser
    nsa_differences:
    - Mcl_NtElevation内核提权(非token::elevate)
    - LP侧运行
