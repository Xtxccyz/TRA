- id: NSA-DS-LC-004
  pattern_type: nested-persistence-framework
  source:
    sample_md5: 'N/A: 文档引用，样本目录未收录'
    tool_name: DanderSpiritz
    component: KillSuit (DecibalMinute/DeMi) + DiveBar (DiBa)
    file: KillSuit driver + DiveBar modules
    function_offset: N/A
    description: 'KillSuit 每个实例托管一个工具（按硬编码 hash ID 标识）。DiveBar 提供 4 种持久化方式: KSLA（未签名驱动）、JustVisiting（利用 ElbyCDIO.sys CVE 漏洞）、SolarTime（VBR bootkit）、Default（标准驱动）。工具二进制加密存储在注册表虚拟文件系统中。'
  mechanism:
    persistence_methods:
    - name: KSLA (Launcher)
      type: unsigned_driver_install
      constraint: 仅限 DSE 启用前
    - name: JustVisiting (JuVi)
      type: signed_driver_exploit
      target: ElbyCDIO.sys
      os_target: 仅限 Windows 8
      registry_key: LSAExtensionConfig\interfaces
    - name: SolarTime (SoTi)
      type: vbr_bootkit
      detail: 修改卷引导记录，比对 VBR hash 与硬编码白名单
    - name: Default
      type: standard_driver_persistence
    implant_hash_ids:
      peddlecheap: '0x7A43E1FA'
      unitedrake: UNKNOWN
      straitbizarre: UNKNOWN
  indicators:
  - type: driver_name
    value: ElbyCDIO.sys
  - type: registry_path
    value: LSAExtensionConfig\interfaces
  - type: implant_hash
    value: '0x7A43E1FA'
  - type: technique
    value: vbr_infection_with_whitelist_check
  - type: technique
    value: registry_virtual_filesystem
  references:
  - '[引用待补全：需定位原文] F-Secure KillSuit 研究 (2019)'
  - '[引用待补全：需定位原文] Kaspersky GrayFish 分析'
  status: confirmed
  confidence: high
  detection_domains:
  - '终端: 注册表LSAExtensionConfig\interfaces键检测(JustVisiting)'
  - '终端: ElbyCDIO.sys驱动漏洞利用检测'
  - '终端: VBR bootkit完整性校验——比对待测VBR hash与白名单'
  source_type: 文档情报交叉验证
  purpose: KillSuit 4种持久化方式(KSLA未签名驱动/JustVisiting利用ElbyCDIO.sys CVE/SolarTime VBR bootkit/Default标准驱动)覆盖从Bootkit到标准驱动的全谱系。[F-Secure 2019]+[Kaspersky GrayFish]独立验证。最高检测优先级。
  discovery_date: '2019'
  finding_tags:
  - 0day
  - 高水平编程
  - 深度绕过
  evidence_level: L3
- id: NSA-DS-LC-005
  pattern_type: kernel-driver-hidden-loading
  source:
    sample_md5: d41df517d60ed2ef7edebb4db9b9dc19
    tool_name: DanderSpiritz
    component: DoubleFeature → hidsvc.sys
    file: Resource 106 → hidsvc.sys
    function_offset: N/A
    description: 'hidsvc.sys rootkit 驱动从自定义资源目录解密，通过 EpMe 漏洞 (CVE-2017-0005) 加载。驱动自我隐藏: 创建无名设备对象，劫持 Device\NULL 句柄，插入 ''driver\msvss''，调用 ObMakeTemporaryObject 从内核跟踪结构中断开链接。'
    host_file: 'DoubleFeatureDll.dll.standard (Resource #106)'
    embedded_note: 'hidsvc.sys 以加密压缩形式嵌入宿主资源 #106，非独立分发'
  mechanism:
    resource_id: 106
    driver_name: hidsvc.sys
    exploit: EpMe (CVE-2017-0005)
    stealth:
    - 创建无名设备对象
    - 劫持 Device\NULL 句柄
    - 重命名为 'driver\msvss'
    - 通过 ObMakeTemporaryObject 从对象管理器断开链接
    api_resolution: MmGetSystemRoutineAddress → HalAllocateCommonBuffer 或 MmIsAddressValid
  indicators:
  - type: driver_name
    value: hidsvc.sys
  - type: device_name
    value: driver\msvss
  - type: technique
    value: ObMakeTemporaryObject_unlink
  - type: cve
    value: CVE-2017-0005
  references:
  - '[引用待补全：需定位原文] Check Point Research, 2021年12月'
  status: confirmed
  confidence: high
  detection_domains:
  - '终端: 无名设备对象检测——DriverObject不关联名称'
  - '终端: ObMakeTemporaryObject断链后的driver\\msvss驱动名检测'
  - '终端: IOCTL 0x85892408通信检测'
  source_type: IDA静态分析发现
  purpose: hidsvc.sys rootkit从DoubleFeature自定义资源目录解密→通过EpMe漏洞(CVE-2017-0005)加载→内核对象管理器断链隐藏。三层嵌套加载链。[Check Point 2021]记录。
  discovery_date: '2013-09-05'
  finding_tags:
  - 0day
  - 深度绕过
- id: NSA-DS-LC-006
  pattern_type: custom-resource-directory-loading
  source:
    sample_md5: d41df517d60ed2ef7edebb4db9b9dc19
    tool_name: DanderSpiritz
    component: DoubleFeatureDll.dll
    file: DoubleFeatureDll.dll
    function_offset: sub_1800223A0 @ 0x1800223A0 (资源表查找), sub_18001D3A0 @ 0x18001D3A0 (PE封装解析), sub_18001D16C @ 0x18001D16C (解密+解压)
    description: 'DLL 扫描自身 .text section 寻找 magic value 以定位自定义资源目录。CONFIRMED from IDA: 资源采用 PE 封装格式 (MZ 0x5A4D + PE 0x4550 头验证在 sub_18001D3A0)。资源表 12 字节条目 (sub_1800223A0): WORD resource_type, WORD resource_id, DWORD data_offset, DWORD data_size。解密链: 4 字节 seed (时间戳) → LCG XOR (sub_180022108) → zlib decompress (sub_180023100)。FindResourceA/LoadResource/SizeofResource/LockResource 全部导入但从未调用 — 确认绕过标准 PE 资源 API。'
    pe_timestamp: '2013-09-05T16:47:25'
  mechanism:
    location: .text section, 代码之后
    discovery: 扫描 magic value
    struct:
    - word word_0
    - word num_of_resources
    - Resource_data[] resource_array
    - dword resource_directory_size
    - dword magic_hash
    resource_entry:
    - word resource_type
    - word resource_num
    - dword offset_from_directory_start
    - dword resource_size
  indicators:
  - type: technique
    value: custom_resource_directory_in_text_section
  - type: technique
    value: magic_value_scan_for_directory
  - type: technique
    value: non_standard_pe_resource_section
  references:
  - '[引用待补全：需定位原文] Check Point Research, 2021年12月'
  status: confirmed
  confidence: high
  detection_domains:
  - '终端: .text节段尾部magic value扫描'
  - '终端: 非标准PE资源目录——12字节条目(WORD type+WORD id+DWORD offset+DWORD size)'
  source_type: 跨样本对比发现
  purpose: 自定义资源目录完全绕过标准PE资源API——FindResourceA/LoadResource导入但从不调用。资源以PE封装格式(MZ+PE头)存储在.text节段尾部，12字节条目结构。对比.unfinalized模板和.standard最终版。[Check Point 2021]首次公开。
  discovery_date: '2013-09-05'
  compared_samples:
  - file: DoubleFeatureDll.dll.unfinalized
    sample_md5: 96642a21a3822016c3e0fb7e06d3a71d
    note: 对比.unfinalized模板vs .standard最终版资源目录结构差异
  finding_tags:
  - 非常规技术
